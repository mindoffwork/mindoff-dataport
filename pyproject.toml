[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindoff_dataport"
version = "0.1.0"
description = "Extract and reconstruct .xlsx templates with full visual fidelity"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1.0", "pyarrow>=15.0", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.coverage.run]
source = ["mindoff_dataport"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
omit = ["src/tests/*", "examples/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/mindoff_dataport"]

[tool.hatch.build.targets.sdist]
exclude = ["/src/tests"]
