name: 📝 Documentation issue
description: Something in the README, docstrings, MkDocs pages, or changelog is wrong, unclear, or missing.
labels: ["documentation"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
  - type: input
    id: location
    attributes:
      label: Where
      description: File and section (e.g. README → "Quick Start", or `developer_guide/exporting-pdf.md` → "Row sizing").
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing
      description: Quote the current text if you can, and say what would be correct or clearer.
    validations:
      required: true
