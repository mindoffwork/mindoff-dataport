name: Root CI

on:
  push:
    branches:
      - root
    paths:
      - "src/**"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/root_ci.yml"
  workflow_dispatch:

concurrency:
  group: root-stability-${{ github.sha }}
  cancel-in-progress: false

jobs:
  smoke-minimal:
    name: Smoke (minimal install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install minimal package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import smoke check
        run: python -c "import mindoff_dataport; print('smoke ok')"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage (min 90%)
        run: |
          PYTHONPATH=src python -m pytest \
            --cov=mindoff_dataport \
            --cov-branch \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: root
          name: root-ci
          fail_ci_if_error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
